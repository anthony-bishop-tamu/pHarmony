[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "PeakMatcher"
dynamic = ["version"]
description = "Package for matching peaks changing chemical"
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0 ",
    "torch>=2.0",
    "matplotlib>=3.2",
    "scipy>=1.10",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
root = "."
write_to = "PeakMatcher/_version.py"

[project.scripts]
PeakMatcher = "PeakMatcher.PeakMatcher:main"
